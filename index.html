<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />

    <!-- Базовые SEO мета-теги -->
    <title>Загрузка...</title>
    <meta name="description" content="" />
    <meta name="keywords" content="" />
    <meta name="author" content="Александр Тихонович" />

    <!-- Open Graph мета-теги (для Telegram, VK, WhatsApp, Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tihonovich.vercel.app" />
    <!-- ИСПРАВЛЕНО: Изменено на полный абсолютный интернет-URL вашей главной картинки -->
    <meta property="og:image" content="https://vercel.app" />
    <meta property="og:title" content="" />
    <meta property="og:description" content="" />

    <!-- Twitter Cards мета-теги (для X / Twitter) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://tihonovich.vercel.app" />
    <!-- ИСПРАВЛЕНО: Изменено на полный абсолютный интернет-URL -->
    <meta name="twitter:image" content="https://vercel.app" />

    <script>
      (function () {
        try {
          const metaConfig = {
            ru: {
              title: "Веб-разработчик и дизайнер – Александр Тихонович",
              description:
                "Портфолио Александра Тихоновича – современная веб-разработка, верстка сайтов и дизайн интерфейсов UI/UX.",
              keywords:
                "веб-разработчик, дизайнер, интерфейсы, портфолио, SkyReglis, верстка, React, frontend, UI, UX",
            },
            en: {
              title: "Web Developer & Designer – Alexander Tihonovich",
              description:
                "Alexander Tihonovich – modern web development, frontend engineering and UI/UX design portfolio.",
              keywords:
                "web developer, designer, UI/UX, portfolio, SkyReglis, React, frontend development, layout",
            },
          };

          const savedTheme = localStorage.getItem("theme");
          const systemDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          document.documentElement.setAttribute(
            "data-theme",
            savedTheme || (systemDark ? "dark" : "light"),
          );

          const savedLng = localStorage.getItem("i18nextLng");
          const browserLng =
            window.navigator.language || window.navigator.userLanguage || "";
          const defaultLng = /(ru|be|uk|kk)/i.test(browserLng) ? "ru" : "en";
          const currentLng = savedLng || defaultLng;

          document.documentElement.setAttribute("lang", currentLng);
          const locale = metaConfig[currentLng] || metaConfig.en;

          document.title = locale.title;
          document
            .querySelector('meta[name="description"]')
            .setAttribute("content", locale.description);
          document
            .querySelector('meta[name="keywords"]')
            .setAttribute("content", locale.keywords);

          document
            .querySelector('meta[property="og:title"]')
            .setAttribute("content", locale.title);
          document
            .querySelector('meta[property="og:description"]')
            .setAttribute("content", locale.description);

          document
            .querySelector('meta[name="twitter:title"]')
            .setAttribute("content", locale.title);
          document
            .querySelector('meta[name="twitter:description"]')
            .setAttribute("content", locale.description);
        } catch (e) {
          console.error("SEO initialization failed", e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
